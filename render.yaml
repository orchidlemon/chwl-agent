services:
  - type: web
    name: meituan-mock-api
    env: python
    plan: free
    rootDir: mock_api
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py

  - type: web
    name: meituan-agent
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MOCK_API_URL
        value: https://meituan-mock-api.onrender.com
      - key: LLM_PROVIDER
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        sync: false
      - key: LONGCAT_API_KEY
        sync: false
      - key: LONGCAT_BASE_URL
        sync: false
